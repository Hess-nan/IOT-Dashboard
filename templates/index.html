<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Air Quality Monitoring</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Digital Font -->
    <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">

    <!-- Bootstrap Icon -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

    <div id="loadingScreen" class="loading-screen" role="status">
        <div class="loading-content">
            <i class="bi bi-wind"></i>
            <p>AIR QUALITY MONITORING</p>
            <span>Loading sensor data...</span>
            <div class="loading-bar"><span></span></div>
        </div>
    </div>

    <div class="phone">

        <!-- ================= HEADER ================= -->

        <header>

            <div class="title">

                <div class="header-left">

                    <i class="bi bi-wind icon-title"></i>

                    <div>

                        <h1>AIR QUALITY MONITORING</h1>

                        <p id="date">Selasa, 28 Juli 2026</p>

                    </div>

                </div>

                <div class="live">

                    <div>

                        <span id="liveIndicator" class="live-indicator"></span>

                        <span id="connectionStatus">WAITING SENSOR</span>

                    </div>

                    <h2 id="clock"></h2>

                    <p id="lastUpdate">

                        Last Update
                        <br>
                        --

                    </p>

                </div>

            </div>

        </header>

        <!-- ================= TSP ================= -->

        <section class="card tsp-card">

            <div class="card-top">

                <p>TOTAL PARTICULATE SUSPENDED</p>

                <span id="statusIspu">Good</span>

            </div>

            <div class="value">

                <span id="tsp">42</span>

                <small>µg/m³</small>

            </div>

            <!-- Chart -->
            <div id="tspChart" class="chart-placeholder"></div>

        </section>

        <!-- ================= ECO2 ================= -->

        <section class="card eco2-card">

            <div class="card-top">

                <p>EQUIVALENT CO₂</p>

                <span id="statusEco2">Moderate</span>

            </div>

            <div class="value">

                <span id="ppmeCO2">847</span>

                <small>ppm</small>

            </div>

            <!-- Chart -->
            <div id="eco2Chart" class="chart-placeholder"></div>

        </section>

        <!-- ================= SMALL CARD ================= -->

        <div class="grid">

            <!-- Temperature -->

            <div class="card small">

                <p>TEMPERATURE</p>

                <div class="small-value">

                    <span id="temperature">28</span>

                    <small>°C</small>

                </div>

                <div id="temperatureChart" class="mini-chart"></div>

            </div>

            <!-- Humidity -->

            <div class="card small">

                <p>HUMIDITY</p>

                <div class="small-value">

                    <span id="humidity">63</span>

                    <small>%</small>

                </div>

                <div id="humidityChart" class="mini-chart"></div>

            </div>

        </div>

        <!-- ================= FOOTER ================= -->

        <footer id="deviceInfo">

            Pembaruan setiap 60 detik · Sensor v2.4.1

        </footer>

    </div>

    <!-- Javascript -->

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>

</html>
